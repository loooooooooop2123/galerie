<style>
/* Hallmark · macrostructure: bespoke (cimaise en coverflow, d'après la maquette) · tone: austere · anchor hue: none (les tableaux portent la couleur)
 * Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4
 * Mise en page : un mur blanc, une rangée horizontale de tableaux en boucle, le tableau actif net au centre,
 * les voisins réduits de chaque côté sous un flou progressif de bord (comme les listes de ONE),
 * la signature et la description fixes sous la rangée.
 */
:root {
  color-scheme: light;
  --wall: oklch(99.3% 0.002 90);
  --ink: oklch(21% 0.008 70);
  --ink-soft: oklch(41% 0.008 70);
  --ink-faint: oklch(66% 0.006 70);
  --placeholder: oklch(88% 0.003 90);
  --shadow-near: oklch(20% 0.01 60 / 0.14);
  --shadow-mid: oklch(20% 0.01 60 / 0.28);
  --shadow-far: oklch(20% 0.01 60 / 0.42);
  --bevel: oklch(99% 0.004 85);
  --rabbet: oklch(15% 0.01 60 / 0.35);

  /* Cadres : un matériau par œuvre */
  --or-clair: oklch(80% 0.075 86);
  --or-fonce: oklch(57% 0.085 73);
  --ebene: oklch(19% 0.008 60);
  --ebene-reflet: oklch(30% 0.01 60);
  --noyer: oklch(33% 0.035 48);
  --noyer-reflet: oklch(42% 0.04 52);
  --chene: oklch(60% 0.055 68);
  --chene-reflet: oklch(68% 0.05 72);
  --paulownia: oklch(86% 0.03 82);
  --paulownia-reflet: oklch(91% 0.022 84);
  --passe-partout: oklch(97.5% 0.006 85);

  --font-sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
/* Sur téléphone, la galerie reste hors de l'encoche, de la barre d'état et de la barre d'accueil. */
html {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

.gallery {
  position: relative;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  outline: none;
}
.gallery.is-dragging { cursor: grabbing; }

#track { position: absolute; inset: 0; }

/* ---------- Tableaux ---------- */
.work {
  position: absolute;
  left: 0;
  top: 0;
  padding: 0;
  border: 0;
  background: none;
  transform-origin: 50% 50%;
  will-change: transform, opacity;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* Le cadre lui-même : c'est lui qui s'incline sous la souris, la position reste sur .work */
.tilt {
  position: absolute;
  inset: 0;
  background: var(--frame);
  /* Ombre portée sur le mur, en trois couches : contact net, ombre moyenne, halo large et doux. */
  box-shadow:
    0 2px 3px var(--shadow-near),
    0 16px 30px -10px var(--shadow-mid),
    0 48px 84px -30px var(--shadow-far);
  transform: perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--lift, 1));
  transition: transform 700ms var(--ease-out), box-shadow 700ms var(--ease-out);
}
.work.is-hover .tilt {
  --lift: 1.02;
  box-shadow:
    0 3px 5px var(--shadow-near),
    0 22px 40px -12px var(--shadow-mid),
    0 64px 100px -34px var(--shadow-far);
  transition-duration: 160ms, 400ms;
}
/* Reflet de vitre qui suit la souris */
.sheen {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), oklch(100% 0 0 / 0.55), transparent 55%);
  mix-blend-mode: soft-light;
  transition: opacity 500ms var(--ease-out);
}
.work.is-hover .sheen { opacity: 1; }
.gallery.is-dragging .work { cursor: grabbing; }
.work[aria-current="true"] { cursor: inherit; }
.work:focus-visible { outline: 2px solid var(--ink); outline-offset: 8px; }

[data-frame="or"] {
  --frame: linear-gradient(135deg, var(--or-clair), var(--or-fonce) 48%, var(--or-clair) 74%, var(--or-fonce));
}
[data-frame="ebene"] {
  --frame: linear-gradient(135deg, var(--ebene-reflet), var(--ebene) 40%, var(--ebene));
}
[data-frame="noyer"] {
  --frame: linear-gradient(135deg, var(--noyer-reflet), var(--noyer) 45%, var(--noyer));
}
[data-frame="chene"] {
  --frame: linear-gradient(135deg, var(--chene-reflet), var(--chene) 50%, var(--chene));
}
[data-frame="paulownia"] {
  --frame: linear-gradient(135deg, var(--paulownia-reflet), var(--paulownia));
}

/* Passe-partout : le cadre y projette une légère ombre, et la fenêtre a un biseau blanc autour de l'œuvre. */
.mat {
  position: absolute;
  background: var(--passe-partout);
  box-shadow: inset 0 0 0 1px var(--shadow-near), inset 0 3px 8px var(--shadow-near);
}
/* La miniature sert d'aperçu flou le temps que l'image pleine taille arrive. */
.canvas {
  position: absolute;
  overflow: hidden;
  background: var(--placeholder) center / cover no-repeat;
  box-shadow: 0 0 0 2px var(--bevel), 0 0 0 3px var(--shadow-near);
}
.canvas::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 1px var(--rabbet), inset 0 1px 3px var(--rabbet);
  pointer-events: none;
}
.canvas img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  opacity: 0;
  transition: opacity 600ms var(--ease-out);
  -webkit-user-drag: none;
}
.canvas img.is-loaded { opacity: 1; }

/* ---------- Flou progressif des bords (repris de ONE) ----------
   Un seul bandeau par côté, qui s'épaissit vers le bord puis se fond dans le mur :
   jamais un flou par tableau. */
.edge {
  position: absolute;
  top: 0;
  width: 0;
  pointer-events: none;
  z-index: 150;
}
.edge-left { left: 0; }
.edge-right { right: 0; }
.edge > i {
  position: absolute;
  inset: 0;
  -webkit-mask-composite: source-in;
  mask-composite: intersect;
}
/* Flou léger, puis le mur reprend : les tableaux lointains s'effacent au lieu de rester en taches floues. */
.edge > i:nth-child(1) { -webkit-backdrop-filter: blur(0.8px); backdrop-filter: blur(0.8px); }
.edge > i:nth-child(2) { -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.edge > i:nth-child(3) { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }

.edge-left > i:nth-child(1) {
  -webkit-mask-image: linear-gradient(to left, transparent 0%, #000 30%), linear-gradient(to top, transparent 0, #000 20px);
  mask-image: linear-gradient(to left, transparent 0%, #000 30%), linear-gradient(to top, transparent 0, #000 20px);
}
.edge-left > i:nth-child(2) {
  -webkit-mask-image: linear-gradient(to left, transparent 25%, #000 60%), linear-gradient(to top, transparent 0, #000 20px);
  mask-image: linear-gradient(to left, transparent 25%, #000 60%), linear-gradient(to top, transparent 0, #000 20px);
}
.edge-left > i:nth-child(3) {
  -webkit-mask-image: linear-gradient(to left, transparent 55%, #000 90%), linear-gradient(to top, transparent 0, #000 20px);
  mask-image: linear-gradient(to left, transparent 55%, #000 90%), linear-gradient(to top, transparent 0, #000 20px);
}
.edge-left > i:nth-child(4) {
  background: linear-gradient(to left, transparent 35%, color-mix(in oklab, var(--wall) 75%, transparent) 70%, var(--wall) 92%);
}
.edge-right > i:nth-child(1) {
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 30%), linear-gradient(to top, transparent 0, #000 20px);
  mask-image: linear-gradient(to right, transparent 0%, #000 30%), linear-gradient(to top, transparent 0, #000 20px);
}
.edge-right > i:nth-child(2) {
  -webkit-mask-image: linear-gradient(to right, transparent 25%, #000 60%), linear-gradient(to top, transparent 0, #000 20px);
  mask-image: linear-gradient(to right, transparent 25%, #000 60%), linear-gradient(to top, transparent 0, #000 20px);
}
.edge-right > i:nth-child(3) {
  -webkit-mask-image: linear-gradient(to right, transparent 55%, #000 90%), linear-gradient(to top, transparent 0, #000 20px);
  mask-image: linear-gradient(to right, transparent 55%, #000 90%), linear-gradient(to top, transparent 0, #000 20px);
}
.edge-right > i:nth-child(4) {
  background: linear-gradient(to right, transparent 35%, color-mix(in oklab, var(--wall) 75%, transparent) 70%, var(--wall) 92%);
}

/* ---------- Signature et description : fixes, seule l'opacité change ---------- */
.captions {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 160;
  display: grid;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.cap {
  grid-area: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  min-width: 0;
}
.cap.is-active { pointer-events: auto; user-select: text; -webkit-user-select: text; cursor: auto; }

.sig-row {
  height: var(--sig-row, 64px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.sig {
  display: block;
  max-width: none;
  object-fit: contain;
  opacity: 0.86;
  -webkit-user-drag: none;
}

.meta {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--ink);
  text-wrap: balance;
}
.meta cite { font-family: var(--font-serif); font-size: 15px; font-weight: 400; letter-spacing: 0; }
.meta .date { font-weight: 400; color: var(--ink-soft); }

.text {
  margin: 0;
  max-width: 33rem;
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-soft);
  text-wrap: pretty;
}

/* ---------- Écran d'accueil ----------
   Le nom, puis les seize œuvres en miniature qui arrivent une à une à mesure qu'elles se chargent. */
.intro {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  place-content: center;
  justify-items: center;
  gap: 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  container-type: inline-size;
  background: var(--wall);
  transition: opacity 800ms var(--ease-out), filter 800ms var(--ease-out), visibility 0s linear 800ms;
}
.intro.is-done { opacity: 0; filter: blur(6px); visibility: hidden; pointer-events: none; }
.intro-brand {
  margin: 0;
  display: grid;
  justify-items: center;
  gap: 14px;
  font-weight: 400;
  text-align: center;
  animation: arrive 1100ms var(--ease-out) both;
}
.intro-name {
  font-family: var(--font-serif);
  font-size: clamp(44px, 7.5vw, 84px);
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.intro-sub {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.36em;
  padding-left: 0.36em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
/* Deux rangées de huit, côte à côte quand la place le permet. La taille suit la largeur disponible,
   donc la rangée ne déborde jamais de l'écran. */
.intro-works {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  max-width: 100%;
}
.intro-row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 9px;
}
@container (min-width: 960px) {
  .intro-works { flex-direction: row; align-items: flex-end; gap: 9px; }
}
.mini {
  height: 30px;
  height: clamp(16px, calc((100cqi - 100px) / 10), 38px);
  aspect-ratio: var(--r);
  padding: 2px;
  background: var(--frame, var(--placeholder));
  box-shadow: 0 8px 14px -10px var(--shadow-far);
  opacity: 0;
  transform: translateY(6px);
  filter: blur(4px);
  transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out), filter 700ms var(--ease-out);
}
.mini.is-in { opacity: 1; transform: none; filter: none; }
.mini img { display: block; width: 100%; height: 100%; max-width: none; object-fit: cover; }
.intro-count {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
@keyframes arrive {
  from { opacity: 0; transform: translateY(8px); filter: blur(6px); }
  to { opacity: 1; transform: none; filter: none; }
}
/* La galerie et le bouton de musique apparaissent quand l'accueil s'efface. */
.gallery, .sound { transition: opacity 1000ms var(--ease-out) 150ms; }
body:not(.is-ready) .gallery, body:not(.is-ready) .sound { opacity: 0; }

/* ---------- Musique : un seul bouton, dans le coin haut droit ----------
   Un petit égaliseur : ses barres dansent doucement quand la musique joue, et restent immobiles et pâles
   quand elle est coupée. On comprend d'un coup d'œil à quoi il sert. */
.sound {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: max(10px, env(safe-area-inset-right, 0px));
  z-index: 200;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  transition: color 200ms var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.sound[aria-pressed="true"] { color: var(--ink-soft); }
.sound:hover { color: var(--ink); }
.sound:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sound svg { display: block; width: 18px; height: 18px; overflow: visible; }
.sound line {
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  transform-box: fill-box;
  transform-origin: center;
  transform: scaleY(var(--h));
  transition: transform 300ms var(--ease-out);
}
.sound line:nth-child(1) { --h: 0.4; }
.sound line:nth-child(2) { --h: 0.75; }
.sound line:nth-child(3) { --h: 0.55; }
.sound[aria-pressed="true"] line { animation: eq 1s ease-in-out infinite alternate; }
.sound[aria-pressed="true"] line:nth-child(1) { animation-duration: 0.82s; animation-delay: -0.3s; }
.sound[aria-pressed="true"] line:nth-child(2) { animation-duration: 1.1s; animation-delay: -0.6s; }
.sound[aria-pressed="true"] line:nth-child(3) { animation-duration: 0.94s; animation-delay: -0.1s; }
@keyframes eq {
  from { transform: scaleY(0.22); }
  to { transform: scaleY(1); }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.defs { position: absolute; width: 0; height: 0; }

@media (max-width: 520px) {
  .text { font-size: 14px; line-height: 1.5; }
  .meta { font-size: 12.5px; }
  .meta cite { font-size: 14px; }
  .cap { gap: 10px; }
  .intro { gap: 30px; }
  .intro-works { gap: 10px; }
  .intro-row { gap: 7px; }
}
/* Téléphone tenu à l'horizontale : trop peu de hauteur pour tout montrer. Le tableau passe en premier,
   avec sa signature et son titre ; la description revient dès qu'on redresse le téléphone. */
@media (max-height: 500px) and (orientation: landscape) {
  .cap .text { display: none; }
  .cap { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .canvas img { transition-duration: 150ms; }
  .sound line { transition: none; }
  .sound[aria-pressed="true"] line { animation: none; --h: 1; }
  .sound[aria-pressed="true"] line:nth-child(1) { --h: 0.6; }
  .intro-brand { animation-name: fade; }
  .mini { transform: none; filter: none; }
  .intro.is-done { filter: none; }
}
@keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>

<div class="intro" id="intro" role="status" aria-label="Chargement de la galerie">
  <p class="intro-brand"><span class="intro-name">Valois</span><span class="intro-sub">Art Advisory</span></p>
  <div class="intro-works" id="intro-works" aria-hidden="true"></div>
  <p class="intro-count" id="intro-count" aria-hidden="true"></p>
</div>

<main class="gallery" id="gallery" tabindex="-1" aria-roledescription="carrousel" aria-label="Galerie de tableaux">
  <h1 class="sr-only">Valois Art Advisory</h1>
  <div id="track"></div>
  <div class="edge edge-left" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="edge edge-right" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="captions" id="captions"></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Activer la musique" title="Activer la musique">
  <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false">
    <line x1="4" y1="1" x2="4" y2="17"></line>
    <line x1="9" y1="1" x2="9" y2="17"></line>
    <line x1="14" y1="1" x2="14" y2="17"></line>
  </svg>
</button>

<!-- Flou de mouvement horizontal, appliqué à la rangée seulement pendant qu'elle bouge -->
<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="mblur" x="-5%" y="0" width="110%" height="100%" color-interpolation-filters="sRGB">
    <feGaussianBlur id="mblur-g" stdDeviation="0 0"></feGaussianBlur>
  </filter>
</svg>

<script>
(() => {
  document.documentElement.lang = 'fr';

  const WORKS = [
    {
      id: 'joconde', artist: 'Léonard de Vinci', title: 'La Joconde', date: 'vers 1503–1519',
      img: 'oeuvres/joconde.jpg', w: 1074, h: 1600, frame: 'or',
      sig: 'signatures/vinci.svg', sr: 5.55,
      text: "Lisa Gherardini, épouse d'un marchand de soie florentin, pose devant un paysage imaginaire de rochers et de rivières. Léonard peint sans contours : le sfumato fond les ombres et laisse le sourire en suspens, impossible à fixer. Il y cherche la vie intérieure de son modèle, cet instant fugace entre deux expressions."
    },
    {
      id: 'ecole-d-athenes', artist: 'Raphaël', title: "L'École d'Athènes", date: '1509–1511',
      img: 'oeuvres/raphael.jpg', w: 1600, h: 998, frame: 'or',
      sig: 'signatures/raphael.svg', sr: 2.30,
      text: "Sous de grandes voûtes inspirées de l'Antiquité, Raphaël réunit les philosophes grecs en une seule assemblée. Au centre, Platon montre le ciel et Aristote désigne la terre : le monde des idées face à celui de l'expérience. Autour d'eux, on débat, on écrit, on mesure. La fresque célèbre le savoir comme une conversation qui traverse les siècles."
    },
    {
      id: 'chasseurs-dans-la-neige', artist: 'Pieter Bruegel l’Ancien', title: 'Les Chasseurs dans la neige', date: '1565',
      img: 'oeuvres/bruegel.jpg', w: 1600, h: 1138, frame: 'chene',
      sig: 'signatures/bruegel.svg', sr: 5.83,
      text: "Trois chasseurs rentrent au village avec leurs chiens, presque bredouilles, un seul renard sur le dos. En contrebas, la vallée gelée s'anime : on patine, on joue, on travaille. Bruegel peint le cycle des saisons et la vie ordinaire des paysans, petite et tenace face à un hiver immense, sous un ciel vert et froid."
    },
    {
      id: 'vocation-de-saint-matthieu', artist: 'Le Caravage', title: 'La Vocation de saint Matthieu', date: '1599–1600',

    {
      id: 'joueurs-de-cartes', artist: 'Paul Cézanne', title: 'Les Joueurs de cartes', date: 'vers 1890–1895',
      img: 'oeuvres/cezanne.jpg', w: 1600, h: 1312, frame: 'chene',
      sig: 'signatures/cezanne.svg', sr: 2.50,
      text: "Deux paysans d'Aix-en-Provence jouent aux cartes, face à face, absorbés et silencieux. Cézanne construit la scène comme une architecture : la bouteille au centre partage la toile, les corps forment des volumes solides. Il cherche à rendre la permanence et la gravité des choses simples, au-delà de l'instant."

    {
      id: 'le-baiser', artist: 'Gustav Klimt', title: 'Le Baiser', date: '1907–1908',
      img: 'oeuvres/baiser.jpg', w: 1280, h: 1284, frame: 'or',
      sig: 'signatures/klimt.png', sr: 2.70,
      text: "Un couple enlacé au bord d'un pré fleuri, enveloppé dans un même manteau d'or. Le vêtement de l'homme se couvre de rectangles noirs et blancs, celui de la femme de cercles colorés et de fleurs, deux motifs qui se fondent en une seule forme. Au sommet de sa période dorée, Klimt fait de l'amour une icône, entre extase et vertige."

  ];


  const N = WORKS.length;
  const R = 4;              // nombre de voisins disposés de chaque côté
  const IDLE = 3000;        // calme demandé avant que la galerie reparte seule
  const DWELL = 2500;       // arrêt sur chaque tableau en défilement automatique (au moins 2 s)
  const SLIDE = 1900;       // durée d'un glissement automatique

  const stage = document.getElementById('gallery');
  const track = document.getElementById('track');
  const captions = document.getElementById('captions');
  const status = document.getElementById('status');
  const edges = [...document.querySelectorAll('.edge')];
  const mblur = document.getElementById('mblur-g');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mod = (a, n) => ((a % n) + n) % n;
  // Écart signé le plus court sur la boucle, dans [-N/2, N/2)
  const wrap = a => { const m = mod(a, N); return m >= N / 2 ? m - N : m; };
  // Échelle des voisins : 1 · 0,71 · 0,38 · 0,22… (proportions de la maquette)
  const scaleAt = d => 1 / (1 + 0.4 * d * d);
  const opacityAt = d => clamp((3 - d) / 0.8, 0, 1);
  const easeInOut = u => 0.5 - Math.cos(Math.PI * u) / 2;

  // Typographie française : espaces fines insécables avant : ; ! ? et dans les guillemets.
  const fr = s => s
    .replace(/ ([:;!?»])/g, ' $1')
    .replace(/« /g, '« ')
    .replace(/vers (\d)/g, 'vers $1');
  const de = name => /^[aeiouyéèh]/i.test(name) ? "d'" + name : 'de ' + name;

  // ---------- DOM ----------
  let suppressClick = false, pointerActive = false;
  const miniOf = w => w.img.replace('oeuvres/', 'oeuvres/mini/');

  const works = WORKS.map((w, i) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'work';
    el.dataset.frame = w.frame;
    el.dataset.i = i;
    el.setAttribute('aria-label', `${w.title}, ${w.artist}`);
    const tilt = Object.assign(document.createElement('span'), { className: 'tilt' });
    const mat = Object.assign(document.createElement('span'), { className: 'mat' });
    const canvas = Object.assign(document.createElement('span'), { className: 'canvas' });
    const sheen = Object.assign(document.createElement('span'), { className: 'sheen' });
    const img = new Image();
    img.alt = '';
    img.draggable = false;
    img.decoding = 'async';
    img.addEventListener('load', () => img.classList.add('is-loaded'), { once: true });
    const loaded = new Promise(res => {
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', res, { once: true });
    });
    canvas.style.backgroundImage = `url("${miniOf(w)}")`;
    canvas.append(img);
    tilt.append(mat);
    tilt.append(canvas, sheen);
    el.append(tilt);
    el.addEventListener('click', () => { if (!suppressClick) { interact(); goNearest(i); } });
    el.addEventListener('focus', () => { if (!pointerActive) { interact(); goNearest(i); } });
    track.append(el);
    return { el, tilt, mat, canvas, img, loaded, requested: false };
  });
  // Les images se chargent à l'approche, pas toutes d'un coup.
  function ensureImage(i) {
    const w = works[i];
    if (w.requested) return;
    w.requested = true;
    w.img.src = WORKS[i].img;
  }

  const caps = WORKS.map(w => {
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML = `
      <div class="sig-row"><img class="sig" src="${w.sig}" alt="Signature ${de(w.artist)}" draggable="false"></div>
      <p class="meta">${w.artist} — <cite>${w.title}</cite><span class="date">, ${fr(w.date)}</span></p>
      <p class="text">${fr(w.text)}</p>`;
    captions.append(cap);
    return { cap, sig: cap.querySelector('.sig'), ratio: w.sr };
  });

  // ---------- Géométrie ----------
  let geo = null;

  function sizeSignatures(hBox, vw) {
    const k = clamp(Math.min(hBox / 380, vw / 430), 0.7, 1.1);
    const row = Math.round(66 * k);
    const area = 5400 * k * k;
    const maxW = Math.min(230 * k, vw - 40);
    captions.style.setProperty('--sig-row', row + 'px');
    for (const c of caps) {
      let h = Math.min(row, Math.sqrt(area / c.ratio));
      let w = h * c.ratio;
      if (w > maxW) { w = maxW; h = w / c.ratio; }
      c.sig.style.width = w.toFixed(1) + 'px';
      c.sig.style.height = h.toFixed(1) + 'px';
    }
    return row;
  }

  // Le tableau actif reçoit toute la place laissée par le texte : une « boîte » qui va presque d'un bord
  // à l'autre sur téléphone et occupe le cœur de l'écran sur ordinateur. Chaque œuvre y tient en gardant
  // ses proportions, avec une surface voisine d'une œuvre à l'autre (un paysage n'écrase pas un portrait).
  function computeGeometry() {
    const vw = stage.clientWidth;
    const vh = stage.clientHeight;
    const narrow = vw < 640;
    const pad = clamp(vh * 0.04, 12, 40);
    const padTop = narrow ? Math.max(pad, 56) : pad;   // le bouton de musique occupe le coin haut droit
    const gapCap = clamp(vh * 0.028, 12, 26);
    // Écran tenu en hauteur (téléphone, tablette verticale) : le tableau prend presque toute la largeur.
    const tall = vh > vw * 1.1;
    const wBox = narrow ? vw * 0.86 : Math.min(vw * (tall ? 0.76 : 0.48), 1000);
    const G = narrow ? 12 : clamp(vw * 0.03, 24, 56);

    let hBox = geo ? geo.hBox : vh * 0.5;
    let capH = 0, sigRow = 0;
    for (let pass = 0; pass < 2; pass++) {
      sigRow = sizeSignatures(hBox, vw);
      capH = captions.offsetHeight;
      const avail = vh - padTop - pad - gapCap - capH;
      hBox = Math.max(90, Math.min(avail, vh * (narrow ? 0.64 : 0.66)));
    }

    // Tous les cadres ont exactement la même taille. Chaque œuvre garde ses proportions et se centre
    // dans un passe-partout, comme dans une exposition aux encadrements identiques.
    const FR = 1.15;                               // format commun des cadres (largeur / hauteur)
    const fh = Math.min(hBox, wBox / FR), fw = fh * FR;
    const t = clamp(fh * 0.03, 5, 18);             // épaisseur de la baguette
    const iw = fw - 2 * t, ih = fh - 2 * t;        // ouverture du cadre, remplie par le passe-partout
    const mm = Math.min(iw, ih) * 0.08;            // marge minimale du passe-partout autour de l'œuvre
    const sizes = WORKS.map(w => {
      const r = w.w / w.h;
      let pw = iw - 2 * mm, ph = pw / r;
      if (ph > ih - 2 * mm) { ph = ih - 2 * mm; pw = ph * r; }
      return { ow: fw, oh: fh, t, pw, ph };
    });
    const maxOH = Math.max(...sizes.map(s => s.oh));
    // Le bloc tableau + texte est centré dans la hauteur, un peu au-dessus du milieu.
    const free = Math.max(0, vh - padTop - pad - (maxOH + gapCap + capH));
    const cy = padTop + free * 0.42 + maxOH / 2;

    // Disposition « au repos » autour de chaque tableau central n (voisins -R…R, en boucle),
    // puis interpolation entre deux repos pendant le mouvement.
    const layouts = [];
    for (let n = 0; n < N; n++) {
      const s = [], x = [];
      for (let k = -R; k <= R; k++) s[k + R] = scaleAt(Math.abs(k));
      x[R] = 0;
      for (let k = 1; k <= R; k++) {
        const a = sizes[mod(n + k - 1, N)], b = sizes[mod(n + k, N)];
        x[R + k] = x[R + k - 1] + (a.ow * s[R + k - 1] + b.ow * s[R + k]) / 2 + G * (s[R + k - 1] + s[R + k]) / 2;
      }
      for (let k = -1; k >= -R; k--) {
        const a = sizes[mod(n + k + 1, N)], b = sizes[mod(n + k, N)];
        x[R + k] = x[R + k + 1] - (a.ow * s[R + k + 1] + b.ow * s[R + k]) / 2 - G * (s[R + k + 1] + s[R + k]) / 2;
      }
      layouts.push({ x, s });
    }

    sizes.forEach((sz, i) => {
      const { el, mat, canvas } = works[i];
      el.style.width = sz.ow + 'px';
      el.style.height = sz.oh + 'px';
      mat.style.inset = sz.t + 'px';
      Object.assign(canvas.style, {
        left: ((sz.ow - sz.pw) / 2).toFixed(1) + 'px',
        top: ((sz.oh - sz.ph) / 2).toFixed(1) + 'px',
        width: sz.pw.toFixed(1) + 'px',
        height: sz.ph.toFixed(1) + 'px'
      });
    });

    // Le texte ne suit pas les tableaux : il reste à la même place, quel que soit le format affiché.
    const capTop = cy + maxOH / 2 + gapCap;
    captions.style.transform = `translate3d(0, ${capTop.toFixed(1)}px, 0)`;
    // Les bandeaux descendent sous les tableaux et leurs ombres, sans toucher au texte (la signature est au centre).
    for (const e of edges) e.style.height = (capTop + sigRow).toFixed(1) + 'px';

    geo = { vw, vh, hBox, cy, G, sizes, layouts };
  }

  // Distance moyenne (px) entre le tableau n et ses voisins : convertit un glissement en tableaux.
  function spacingAt(n) {
    const L = geo.layouts[mod(n, N)];
    return (L.x[R + 1] - L.x[R - 1]) / 2;
  }

  // ---------- Rendu ----------
  let p = 0;

  function render() {
    const { vw, cy, G, sizes, layouts } = geo;
    const n = Math.floor(p);
    const t = p - n;
    const A = layouts[mod(n, N)], B = layouts[mod(n + 1, N)];

    for (let i = 0; i < N; i++) {
      const k0 = Math.round(wrap(i - n));
      const k1 = k0 - 1;
      const d = Math.abs(k0 - t);
      const st = works[i].el.style;
      const inRange = Math.abs(k0) <= R && Math.abs(k1) <= R;
      const o = inRange ? opacityAt(d) : 0;
      if (o <= 0.001) {
        if (st.visibility !== 'hidden') st.visibility = 'hidden';
      } else {
        const sz = sizes[i];
        const s = lerp(A.s[k0 + R], B.s[k1 + R], t);
        const x = lerp(A.x[k0 + R], B.x[k1 + R], t);
        st.transform = `translate3d(${(vw / 2 + x - sz.ow / 2).toFixed(2)}px, ${(cy - sz.oh / 2).toFixed(2)}px, 0) scale(${s.toFixed(4)})`;
        st.opacity = o.toFixed(3);
        st.visibility = 'visible';
        st.zIndex = String(100 - Math.round(d * 10));
      }
      if (d < 5.5) ensureImage(i);

      const c = caps[i].cap.style;
      const co = clamp(1 - d * 1.8, 0, 1);
      c.opacity = co.toFixed(3);
      c.visibility = co > 0.01 ? 'visible' : 'hidden';
    }

    // Les bandeaux de flou s'arrêtent juste avant le tableau actif, qui reste net.
    const ow = lerp(sizes[mod(n, N)].ow, sizes[mod(n + 1, N)].ow, t);
    const band = Math.max(0, vw / 2 - ow / 2 - G * 0.5);
    for (const e of edges) e.style.width = band.toFixed(1) + 'px';
  }

  let current = -1;
  function setCurrent(i, announce) {
    if (i === current) return;
    current = i;
    works.forEach((w, k) => {
      if (k === i) w.el.setAttribute('aria-current', 'true'); else w.el.removeAttribute('aria-current');
    });
    caps.forEach((c, k) => {
      c.cap.classList.toggle('is-active', k === i);
      c.cap.setAttribute('aria-hidden', k === i ? 'false' : 'true');
    });
    if (announce) status.textContent = `${WORKS[i].title}, ${WORKS[i].artist}`;
  }

  // ---------- Flou de mouvement ----------
  let mbOn = false;
  function setMotionBlur(pxPerSecond) {
    const sd = reduceMotion.matches ? 0 : Math.min(2.5, Math.abs(pxPerSecond) * 0.006);
    if (sd < 0.25) {
      if (mbOn) { track.style.filter = 'none'; mbOn = false; }
      return;
    }
    mblur.setAttribute('stdDeviation', sd.toFixed(2) + ' 0');
    if (!mbOn) { track.style.filter = 'url(#mblur)'; mbOn = true; }
  }

  // ---------- Mouvement ----------
  // Trois moteurs : le doigt (glisser), un ressort amorti (clic, clavier, molette, lâcher),
  // et un glissement lent et régulier pour le défilement automatique.
  let target = 0, v = 0, springOn = false, tween = null, drag = null;
  let raf = 0, last = 0, vel = 0;
  let lastInteract = performance.now(), lastArrive = performance.now();
  // Ressort souple : la rangée met près d'une seconde à se poser, comme un objet lourd.
  const K = 70, C = 2 * Math.sqrt(K);

  function arrived() { lastArrive = performance.now(); }

  function frame(now) {
    const dt = clamp((now - last) / 1000, 0.001, 0.25);
    last = now;
    const prev = p;

    if (drag && drag.active) {
      // La rangée suit la main avec un léger retard : elle a du poids.
      p += (drag.rawP - p) * (1 - Math.exp(-dt * 10));
    } else if (tween) {
      const u = clamp((now - tween.t0) / tween.dur, 0, 1);
      p = tween.from + (tween.to - tween.from) * easeInOut(u);
      if (u >= 1) { p = tween.to; tween = null; v = 0; arrived(); }
    } else if (springOn) {
      // Pas fixes : le mouvement garde la même durée, quelle que soit la cadence d'affichage.
      let left = dt;
      while (left > 0) {
        const h = Math.min(left, 1 / 240);
        v += (-K * (p - target) - C * v) * h;
        p += v * h;
        left -= h;
      }
      if (Math.abs(p - target) < 0.0004 && Math.abs(v) < 0.002) { p = target; v = 0; springOn = false; arrived(); }
    }

    vel += ((p - prev) / dt - vel) * (1 - Math.exp(-dt * 16));
    setMotionBlur(vel * spacingAt(Math.round(p)));
    if (drag && drag.active) setCurrent(mod(Math.round(p), N), false);
    render();

    const busy = (drag && drag.active) || tween || springOn || Math.abs(vel) > 0.01;
    if (busy) raf = requestAnimationFrame(frame);
    else { raf = 0; vel = 0; setMotionBlur(0); }
  }
  function kick() {
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }

  function go(to) {
    if (tween) { v = vel; tween = null; }
    target = Math.round(to);
    setCurrent(mod(target, N), true);
    if (reduceMotion.matches) { p = target; v = 0; springOn = false; render(); arrived(); return; }
    springOn = true;
    kick();
  }
  // Vers le tableau i par le chemin le plus court de la boucle
  function goNearest(i) {
    const base = (springOn || tween) ? target : Math.round(p);
    go(base + wrap(i - base));
  }
  function interact() { lastInteract = performance.now(); }

  function autoAdvance() {
    const to = Math.round(p) + 1;
    target = to;
    setCurrent(mod(to, N), false);
    if (reduceMotion.matches) { p = to; render(); arrived(); return; }
    unhover();
    tween = { from: p, to, t0: performance.now(), dur: SLIDE };
    springOn = false;
    kick();
  }

  // ---------- Défilement automatique ----------
  let readingCaption = false, ready = false;
  captions.addEventListener('pointerover', () => { readingCaption = true; });
  captions.addEventListener('pointerout', e => { if (!captions.contains(e.relatedTarget)) readingCaption = false; });
  setInterval(() => {
    if (!ready || document.hidden || drag || tween || springOn || readingCaption) return;
    const now = performance.now();
    if (now - lastInteract < IDLE || now - lastArrive < DWELL) return;
    autoAdvance();
  }, 200);

  // ---------- Glisser (souris, doigt, stylet) ----------
  stage.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.cap.is-active')) return;
    interact();
    pointerActive = true;
    drag = { id: e.pointerId, x0: e.clientX, p0: p, rawP: p, spacing: spacingAt(Math.round(p)), active: false, samples: [] };
  });
  function follow(e) {
    const dx = e.clientX - drag.x0;
    if (!drag.active) {
      if (Math.abs(dx) < 5) return;
      drag.active = true;
      drag.p0 = p;
      if (e.type === 'pointermove') stage.setPointerCapture(e.pointerId);
      stage.classList.add('is-dragging');
      tween = null; springOn = false; v = 0;
      unhover();
      kick();
    }
    drag.rawP = drag.p0 - dx / drag.spacing;
    const now = performance.now();
    drag.samples.push({ t: now, p: drag.rawP });
    while (drag.samples.length > 2 && now - drag.samples[0].t > 90) drag.samples.shift();
  }
  stage.addEventListener('pointermove', e => {
    if (drag && e.pointerId === drag.id) follow(e);
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.type === 'pointerup') follow(e);
    interact();
    const d = drag;
    drag = null;
    pointerActive = false;
    stage.classList.remove('is-dragging');
    if (!d.active) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    let speed = 0;
    const s = d.samples;
    if (s.length > 1) {
      const a = s[0], b = s[s.length - 1];
      if (b.t - a.t > 0 && performance.now() - b.t < 120) speed = (b.p - a.p) / ((b.t - a.t) / 1000);
    }
    // Un geste vif avance d'un seul tableau ; un glisser lent se pose sur le plus proche.
    // La rangée repart de là où elle est, avec sa propre vitesse, sans à-coup.
    const aim = d.rawP;
    let to = Math.round(aim);
    if (Math.abs(speed) > 1) to = speed > 0 ? Math.floor(aim) + 1 : Math.ceil(aim) - 1;
    v = clamp(vel, -4, 4);
    go(to);
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // ---------- Survol à la souris (ordinateur seulement) ----------
  // Le cadre s'incline vers la souris, se soulève un peu, et un reflet de vitre suit le curseur.
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
  let hovered = null;
  function unhover() {
    if (!hovered) return;
    const st = hovered.tilt.style;
    hovered.el.classList.remove('is-hover');
    st.setProperty('--rx', '0deg');
    st.setProperty('--ry', '0deg');
    hovered = null;
  }
  stage.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !finePointer.matches || reduceMotion.matches) return;
    if (drag && drag.active) return;
    const el = e.target.closest('.work');
    const w = el ? works[+el.dataset.i] : null;
    if (w !== hovered) {
      unhover();
      if (!w) return;
      hovered = w;
      w.el.classList.add('is-hover');
    }
    if (!w) return;
    interact();
    const r = w.el.getBoundingClientRect();
    const u = clamp((e.clientX - r.left) / r.width, 0, 1);
    const q = clamp((e.clientY - r.top) / r.height, 0, 1);
    const st = w.tilt.style;
    st.setProperty('--rx', ((0.5 - q) * 10).toFixed(2) + 'deg');
    st.setProperty('--ry', ((u - 0.5) * 12).toFixed(2) + 'deg');
    st.setProperty('--mx', (u * 100).toFixed(1) + '%');
    st.setProperty('--my', (q * 100).toFixed(1) + '%');
  });
  stage.addEventListener('pointerleave', unhover);

  // ---------- Molette et pavé tactile ----------
  let wheelAcc = 0, wheelLock = 0, wheelMag = 0, wheelReset = 0;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    interact();
    const raw = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    const px = e.deltaMode === 1 ? raw * 16 : raw;
    const mag = Math.abs(px);
    const now = performance.now();
    clearTimeout(wheelReset);
    wheelReset = setTimeout(() => { wheelAcc = 0; wheelMag = 0; }, 200);
    if (now < wheelLock) {
      // L'inertie d'un pavé tactile décroît : on la laisse s'éteindre sans changer de tableau.
      if (mag < wheelMag * 0.98 || mag < 4) wheelLock = now + 120;
      wheelMag = mag;
      return;
    }
    wheelAcc += px;
    wheelMag = mag;
    if (Math.abs(wheelAcc) >= 40) {
      const dir = Math.sign(wheelAcc);
      wheelAcc = 0;
      wheelLock = now + 380;
      go(target + dir);
    }
  }, { passive: false });

  // ---------- Clavier ----------
  addEventListener('keydown', e => {
    if (!ready || e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown') go(target + 1);
    else if (k === 'ArrowLeft' || k === 'PageUp') go(target - 1);
    else if (k === 'Home') goNearest(0);
    else if (k === 'End') goNearest(N - 1);
    else return;
    e.preventDefault();
    interact();
    if (stage.contains(document.activeElement) && document.activeElement.classList.contains('work')) {
      pointerActive = true;
      works[mod(target, N)].el.focus({ preventScroll: true });
      pointerActive = false;
    }
  });

  // ---------- Démarrage ----------
  const fromHash = WORKS.findIndex(w => '#' + w.id === location.hash);
  p = target = Math.max(0, fromHash);
  computeGeometry();
  setCurrent(target, false);
  render();

  // ---------- Écran d'accueil ----------
  // Il reste au moins le temps de lire le nom et de voir passer les œuvres, puis s'efface dès que
  // les miniatures et les tableaux visibles au centre sont chargés (au plus 9 s, même sur un réseau lent).
  const intro = document.getElementById('intro');
  const introWorks = document.getElementById('intro-works');
  const introCount = document.getElementById('intro-count');
  const introStart = performance.now();
  const MIN_INTRO = reduceMotion.matches ? 900 : 2600, MAX_INTRO = 9000;
  const pad2 = n => String(n).padStart(2, '0');
  let shown = 0;
  introCount.textContent = `${pad2(0)} / ${pad2(N)}`;
  const introRows = [0, 1].map(() => introWorks.appendChild(Object.assign(document.createElement('div'), { className: 'intro-row' })));
  const minis = WORKS.map((w, i) => {
    const m = document.createElement('span');
    m.className = 'mini';
    m.dataset.frame = w.frame;
    m.style.setProperty('--r', (w.w / w.h).toFixed(4));
    const im = new Image();
    im.alt = '';
    im.decoding = 'async';
    const done = new Promise(res => {
      im.addEventListener('load', res, { once: true });
      im.addEventListener('error', res, { once: true });
    });
    im.src = miniOf(w);
    m.append(im);
    introRows[i < N / 2 ? 0 : 1].append(m);
    // Chaque œuvre arrive à son tour, une fois chargée.
    done.then(() => {
      const wait = Math.max(0, introStart + 250 + i * 110 - performance.now());
      setTimeout(() => {
        m.classList.add('is-in');
        introCount.textContent = `${pad2(++shown)} / ${pad2(N)}`;
      }, wait);
    });
    return done;
  });
  const centre = works.filter((_, i) => Math.abs(wrap(i - target)) <= 2).map(w => w.loaded);
  Promise.race([Promise.all([...minis, ...centre]), new Promise(r => setTimeout(r, MAX_INTRO))])
    .then(() => new Promise(r => setTimeout(r, Math.max(0, introStart + MIN_INTRO - performance.now()))))
    .then(() => {
      ready = true;
      lastInteract = lastArrive = performance.now();
      document.body.classList.add('is-ready');
      intro.classList.add('is-done');
      stage.focus({ preventScroll: true });
      setTimeout(() => { intro.hidden = true; }, 900);
      document.dispatchEvent(new Event('valois:ready'));
    });

  let resizeRaf = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => { computeGeometry(); render(); });
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeGeometry(); render(); });
})();
</script>

<script>
// ---------- Musique ----------
// Deux pièces de Bach jouées par Kimiko Ishizaka (enregistrements CC0, Wikimedia Commons) :
// Prélude en ut majeur BWV 846, puis Aria des Variations Goldberg BWV 988, enchaînés en boucle.
// Elle démarre à la fin de l'écran d'accueil. Les navigateurs refusent le son avant un premier geste
// du visiteur : dans ce cas, elle part à son premier clic, toucher ou appui de touche. Elle continue
// d'un tableau à l'autre, et un visiteur qui la coupe ne l'entend plus repartir seule.
(() => {
  const TRACKS = ['musique/bach-prelude-ut-majeur.mp3', 'musique/bach-goldberg-aria.mp3'];
  const LEVEL = 0.32;   // volume d'écoute : environ −10 dB sous des fichiers déjà normalisés à −23 LUFS
  const FADE_IN = 3, FADE_OUT = 1.5, XFADE = 4;

  const btn = document.getElementById('sound');
  // Web Audio quand la page est servie : fondus précis, y compris sur iPhone où le volume d'un
  // élément audio ne se règle pas. Ouverte depuis le disque, la page règle le volume des éléments.
  const AC = window.AudioContext || window.webkitAudioContext;
  const useWebAudio = location.protocol !== 'file:' && !!AC;
  let ctx = null, master = null, players = null, current = 0, on = false, pauseTimer = 0;
  let wantAuto = false, armed = false;

  // Le choix du visiteur (musique coupée ou non) est gardé d'une visite à l'autre.
  const KEY = 'valois-musique';
  const prefOff = () => { try { return localStorage.getItem(KEY) === 'off'; } catch { return false; } };
  const savePref = v => { try { localStorage.setItem(KEY, v); } catch {} };

  // Un niveau de volume qu'on fait glisser dans le temps.
  function makeLevel(param, apply) {
    let value = 0, anim = 0;
    return {
      get value() { return value; },
      to(v, seconds) {
        if (param) {
          const now = ctx.currentTime;
          param.cancelScheduledValues(now);
          param.setValueAtTime(param.value, now);
          param.linearRampToValueAtTime(v, now + seconds);
          value = v;
          return;
        }
        clearInterval(anim);
        const from = value, t0 = performance.now(), ms = Math.max(1, seconds * 1000);
        anim = setInterval(() => {
          const u = Math.min(1, (performance.now() - t0) / ms);
          value = from + (v - from) * u;
          apply();
          if (u >= 1) clearInterval(anim);
        }, 30);
      }
    };
  }

  function setup() {
    if (useWebAudio) {
      ctx = new AC();
      const out = ctx.createGain();
      out.gain.value = 0;
      out.connect(ctx.destination);
      master = makeLevel(out.gain);
      players = TRACKS.map(src => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        const g = ctx.createGain();
        g.gain.value = 0;
        ctx.createMediaElementSource(audio).connect(g).connect(out);
        return { audio, level: makeLevel(g.gain), leaving: false };
      });
    } else {
      const apply = () => players.forEach(p => { p.audio.volume = Math.min(1, Math.max(0, master.value * p.level.value)); });
      master = makeLevel(null, apply);
      players = TRACKS.map(src => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = 0;
        return { audio, level: makeLevel(null, apply), leaving: false };
      });
    }
    players.forEach((p, i) => {
      const near = () => on && i === current && !p.leaving && p.audio.duration - p.audio.currentTime <= XFADE;
      p.audio.addEventListener('timeupdate', () => { if (near()) crossfade(); });
      p.audio.addEventListener('ended', () => { if (on && i === current) crossfade(); });
    });
  }

  // Fondu enchaîné vers la pièce suivante, sans silence entre les deux.
  function crossfade() {
    const a = players[current];
    a.leaving = true;
    a.level.to(0, XFADE);
    setTimeout(() => { a.audio.pause(); a.leaving = false; }, XFADE * 1000 + 150);
    current = (current + 1) % players.length;
    const b = players[current];
    b.audio.currentTime = 0;
    b.level.to(1, XFADE);
    b.audio.play().catch(() => {});
  }

  function show() {
    const label = on ? 'Couper la musique' : 'Activer la musique';
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }

  function start(fromAuto) {
    if (!players) setup();
    disarm();
    on = true;
    clearTimeout(pauseTimer);
    if (ctx && ctx.state !== 'running') ctx.resume();
    const p = players[current];
    if (p.level.value < 1) p.level.to(1, 0.05);
    p.audio.play().catch(() => { on = false; show(); if (fromAuto) arm(); });
    master.to(LEVEL, FADE_IN);
    show();
  }

  function stop() {
    on = false;
    master.to(0, FADE_OUT);
    clearTimeout(pauseTimer);
    pauseTimer = setTimeout(() => { if (!on) players.forEach(p => p.audio.pause()); }, FADE_OUT * 1000 + 150);
    show();
  }

  btn.addEventListener('click', () => {
    if (on) { stop(); wantAuto = false; savePref('off'); }
    else { start(); savePref('on'); }
  });

  // ---------- Démarrage à la fin de l'écran d'accueil ----------
  const GESTURES = ['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'];
  function onGesture(e) {
    if (e.target.closest && e.target.closest('#sound')) return;   // le bouton s'en charge lui-même
    if (navigator.userActivation && !navigator.userActivation.isActive) return;
    if (wantAuto && !on && !prefOff()) start();
    else disarm();
  }
  function arm() {
    if (armed) return;
    armed = true;
    GESTURES.forEach(t => addEventListener(t, onGesture, true));
  }
  function disarm() {
    if (!armed) return;
    armed = false;
    GESTURES.forEach(t => removeEventListener(t, onGesture, true));
  }
  function autoStart() {
    if (on || prefOff() || document.hidden) return;
    if (!players) setup();
    const activated = navigator.userActivation && navigator.userActivation.hasBeenActive;
    if (activated || (ctx && ctx.state === 'running')) {
      start(true);
      // Certains navigateurs (Safari) exigent un geste au moment même : sinon on attend le prochain.
      setTimeout(() => {
        if (on && ctx && ctx.state !== 'running') {
          players.forEach(p => p.audio.pause());
          on = false;
          show();
          arm();
        }
      }, 600);
      return;
    }
    if (!ctx) {
      // Fichier ouvert depuis le disque : on essaie, le navigateur répond par oui ou non.
      players[current].audio.play().then(() => { if (!on) start(); }, arm);
      return;
    }
    arm();
  }
  document.addEventListener('valois:ready', () => { wantAuto = true; autoStart(); });

  // Onglet en arrière-plan : la musique s'efface et reprend au retour, si elle était active.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && wantAuto && !on) { autoStart(); return; }
    if (!on || !players) return;
    if (document.hidden) {
      master.to(0, 0.8);
      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(() => { if (document.hidden) players.forEach(p => p.audio.pause()); }, 900);
    } else {
      clearTimeout(pauseTimer);
      if (ctx && ctx.state !== 'running') ctx.resume();
      players[current].audio.play().catch(() => {});
      master.to(LEVEL, 2);
    }
  });
})();
</script>
</body>
